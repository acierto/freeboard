schema: spec-driven
context: |
  Freeboard is a local-only Tauri 2 desktop app with a Rust core and React/TypeScript UI for macOS, Linux, and Windows.
  Product source: docs/reference/FREEBOARD_SPEC.md. Visual and interaction reference: docs/reference/freeboard-prototype.html.
  The spec wins on data, safety and behavior; the prototype wins on layout, flows, labels and tone. Record conflicts in docs/decisions.md.
  Safety invariants in the product specification override feature requirements and prototype behavior.
  Deliver the six source milestones in order; each requires evidence on all three platforms before proceeding.
  Never execute real cleanup against the developer machine; use temporary fixtures and fake tool executables.
  Never run kubectl exec or bypass the Kubernetes remote execution ban.
  Visual fidelity to the supplied prototype is mandatory, including Dinghy, the harbor scene, typography, layout, colors, light and night themes, and responsive behavior.
rules:
  specs:
    - Include observable acceptance scenarios and source traceability.
    - UI requirements must include screenshot comparison against the supplied design.
  design:
    - Explain safety boundaries and differences between prototype simulation and production behavior.
  tasks:
    - Keep milestone exit gates explicit and all unperformed work unchecked.
    - Include verification-tool tasks that compare implemented visuals with the design and fail on unresolved mismatches or missing evidence.
operations:
  apply:
    guidance:
      - Complete one milestone at a time and stop after its exit gate passes.
      - Verification must inspect rendered screenshots against the supplied prototype; functional tests alone do not establish design fidelity.
  archive:
    guidance:
      - Do not report visual verification as passed without reference, actual, diff, and review evidence for the required matrix.
