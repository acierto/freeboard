[package]
name = "freeboard"
version = "0.1.0"
description = "Warns before disk space runs out and explains what can be reclaimed safely"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[lib]
name = "freeboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "freeboard"
path = "src/main.rs"

[features]
default = ["desktop"]
# The `desktop` feature pulls in the Tauri shell. The core library (guard,
# runner, store, monitor, scan, detectors, cleanup) builds and tests without it.
test-support = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-notification", "dep:tauri-plugin-autostart", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
jwalk = "0.8"
sysinfo = { version = "0.40", default-features = false, features = ["disk", "system"] }
trash = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
sha2 = "0.10"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
