name: release

# Push a tag like v0.1.0 to build installers and publish them as a GitHub
# Release. Asset names are fixed so the download page can link to
# releases/latest/download/<name>.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v0.1.0, or a branch to build test installers from"
        required: true
      publish:
        description: "Publish to the GitHub Release (off: installers stay as workflow artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One DMG per processor: a universal app carries both and is
          # twice the size (15.8 MB instead of about 8 MB).
          - name: macOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: linux-x86_64
            os: ubuntu-22.04
            args: --bundles deb,appimage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: --bundles deb,appimage
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis,msi
          # WiX (MSI) cannot build Arm64 packages; the setup .exe covers it.
          - name: windows-arm64
            os: windows-11-arm
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev file
      - run: npm ci
      - name: Core tests (fixtures and fake tools only)
        working-directory: src-tauri
        run: |
          git config --global user.name "Freeboard CI"
          git config --global user.email "ci@freeboard.invalid"
          git config --global init.defaultBranch main
          cargo test --no-default-features --locked
      - name: Build installers
        # createUpdaterArtifacts signs the update files (macOS .app.tar.gz,
        # the Windows installers, the AppImage and .deb) with the project's
        # minisign key; tauri.conf.json holds the public key (docs/decisions.md,
        # "Updates only when asked").
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }}
      - name: DMG window layout (background and icon positions)
        # Tauri arranges the DMG window through Finder, which does not run on
        # CI; scripts/macos/dmg-layout.sh adds the layout saved from a Mac build.
        if: runner.os == 'macOS'
        run: scripts/macos/dmg-layout.sh "$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)"
      - name: Collect with fixed names
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          b=src-tauri/target
          # Every file name carries the version (Freeboard-1.6.0-macOS-arm64.dmg),
          # so a new download is never mistaken for an older one with the same name.
          v="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          # A version tag must match the app's version, or the files would be
          # named and labelled differently from what the app reports.
          case "$TAG" in v[0-9]*) [ "$TAG" = "v$v" ] || { echo "Tag $TAG does not match the app version $v" >&2; exit 1; };; esac
          case "${{ matrix.name }}" in
            macOS-*)
              cp "$(ls $b/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)" "out/Freeboard-$v-${{ matrix.name }}.dmg"
              # The update file: the signed, compressed .app.
              cp $b/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz "out/Freeboard-$v-${{ matrix.name }}.app.tar.gz"
              cp $b/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig "out/Freeboard-$v-${{ matrix.name }}.app.tar.gz.sig" ;;
            linux-*)
              arch="${{ matrix.name }}"; arch="${arch#linux-}"
              # apt package name freeboard-disk (scripts/linux/rename-deb.sh).
              # Repackaging changes the bytes, so the .deb is signed again.
              scripts/linux/rename-deb.sh "$(ls $b/release/bundle/deb/*.deb | head -1)" "out/Freeboard-$v-linux-$arch.deb"
              npx tauri signer sign "out/Freeboard-$v-linux-$arch.deb"
              cp "$(ls $b/release/bundle/appimage/*.AppImage | head -1)" "out/Freeboard-$v-linux-$arch.AppImage"
              cp "$(ls $b/release/bundle/appimage/*.AppImage.sig | head -1)" "out/Freeboard-$v-linux-$arch.AppImage.sig" ;;
            windows-*)
              arch="${{ matrix.name }}"; arch="${arch#windows-}"
              cp "$(ls $b/release/bundle/nsis/*.exe | head -1)" "out/Freeboard-$v-windows-$arch-setup.exe"
              cp "$(ls $b/release/bundle/nsis/*.exe.sig | head -1)" "out/Freeboard-$v-windows-$arch-setup.exe.sig"
              if ls $b/release/bundle/msi/*.msi >/dev/null 2>&1; then
                cp "$(ls $b/release/bundle/msi/*.msi | head -1)" "out/Freeboard-$v-windows-$arch.msi"
                cp "$(ls $b/release/bundle/msi/*.msi.sig | head -1)" "out/Freeboard-$v-windows-$arch.msi.sig"
              fi ;;
          esac
          # Every update file has its signature.
          for f in out/*.app.tar.gz out/*.AppImage out/*.deb out/*-setup.exe out/*.msi; do
            [ -e "$f" ] || continue
            [ -s "$f.sig" ] || { echo "no signature for $f" >&2; exit 1; }
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update manifest (latest.json)
        # The app's updater reads releases/latest/download/latest.json. The
        # note is the annotated tag's subject (empty for a plain tag).
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
          notes="$(git for-each-ref "refs/tags/$TAG" --format='%(if:equals=tag)%(objecttype)%(then)%(contents:subject)%(end)')"
          NOTES="$notes" node scripts/release/latest-json.mjs dist "${TAG#v}" "https://github.com/${{ github.repository }}/releases/download/$TAG" > dist/latest.json
          cat dist/latest.json
      - name: Checksums
        working-directory: dist
        run: sha256sum Freeboard-* latest.json > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<NOTES
          Freeboard ${TAG#v} for macOS, Windows and Linux.

          Download page: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

          - **macOS** (11+): \`Freeboard-${TAG#v}-macOS-arm64.dmg\` for Apple silicon (M1 and later), \`Freeboard-${TAG#v}-macOS-x64.dmg\` for Intel Macs. Not notarized yet: after the first launch is blocked, open System Settings → Privacy & Security → Open Anyway.
          - **Windows** (10 and 11): \`Freeboard-${TAG#v}-windows-x64-setup.exe\` (or \`.msi\`), \`Freeboard-${TAG#v}-windows-arm64-setup.exe\` for Arm PCs. Not code-signed yet: SmartScreen shows "Windows protected your PC"; choose More info → Run anyway.
          - **Linux** (Ubuntu 22.04+ or similar): \`.deb\` or AppImage for x86_64 and arm64. In apt the package is \`freeboard-disk\` (Ubuntu's own \`freeboard\` is an unrelated IoT dashboard). The \`.deb\` needs nothing extra; for the AppImage run \`chmod +x Freeboard*.AppImage\` once, then open it.

          Verify downloads with \`SHA256SUMS.txt\`.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Freeboard ${TAG#v}" --notes-file notes.md
          fi
