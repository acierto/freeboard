<title>Freeboard Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout concept: a toy harbor. Dinghy, a small boat, sits lower as the disk fills, and crates on deck are the space you can throw overboard. */
:root {
  --bg: #F1FAFB; --card: #FFFFFF; --soft: #E3F4F6; --ink: #1E3A52; --muted: #526B84; --line: #CDE3E8;
  --accent: #0C7786; --accent-ink: #FFFFFF; --toss-edge: #075460;
  --sky-a: #BCE9F7; --sky-b: #E9FAF6; --sun: #FFD76B; --star: 0; --cloud: #FFFFFF;
  --sea-a: #5CCBDD; --sea-b: #2FA9C5; --hull: #FF8B7B; --hull-dark: #E96A5C; --cabin: #FFFFFF; --crate: #FFC867; --crate-edge: #DE9A2C; --boat-ink: #23405A;
  --safe: #17805A; --review: #9A5F07; --risky: #C2334A; --bubble: #FFFFFF;
  --t-a: #A8E3D0; --t-b: #A9D8F5; --t-c: #FFD79A; --t-d: #F7B9C8; --t-e: #CFC3F5; --t-f: #C9EBA8; --t-g: #BFE7EC; --t-h: #D5DCEB; --t-ink: #1E3A52;
  --display: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1C31; --card: #172A47; --soft: #1F3558; --ink: #EAF2FF; --muted: #AFC0DA; --line: #2D4468;
  --accent: #72DCE9; --accent-ink: #082631; --toss-edge: #2E9BAA;
  --sky-a: #0E1A38; --sky-b: #233B6B; --sun: #F5EBC4; --star: 1; --cloud: #33497A;
  --sea-a: #2B8BAA; --sea-b: #17607F; --bubble: #243C63;
  --safe: #70DDAA; --review: #F3C266; --risky: #FF97A5; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1C31; --card: #172A47; --soft: #1F3558; --ink: #EAF2FF; --muted: #AFC0DA; --line: #2D4468;
  --accent: #72DCE9; --accent-ink: #082631; --toss-edge: #2E9BAA;
  --sky-a: #0E1A38; --sky-b: #233B6B; --sun: #F5EBC4; --star: 1; --cloud: #33497A;
  --sea-a: #2B8BAA; --sea-b: #17607F; --bubble: #243C63;
  --safe: #70DDAA; --review: #F3C266; --risky: #FF97A5; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 600 15px/1.5 var(--body); }
.page { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-block: 12px 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 25px; } h3 { font-size: 18px; }
p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.btn { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 8px 14px; font-weight: 800; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { padding: 12px 18px; font-size: 17px; width: 100%; font-family: var(--display); font-weight: 600; }
.btn.bad { border-color: var(--risky); color: var(--risky); }
.link { border: 0; background: none; padding: 2px 0; color: var(--accent); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 18px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.brand { font-family: var(--display); font-size: 25px; font-weight: 700; }
.top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--muted); }
.sim { display: flex; align-items: center; gap: 6px; }
input[type="range"] { accent-color: var(--accent); max-width: 120px; }
.tray { position: relative; }
.tray-btn { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 3px 12px; font-weight: 800; }
.icon-btn { border: 2px solid var(--line); background: var(--card); border-radius: 50%; width: 36px; height: 36px; font-size: 17px; line-height: 1; padding: 0; color: var(--ink); }
.popover { position: absolute; right: 0; top: calc(100% + 8px); z-index: 6; width: min(330px, calc(100vw - 32px)); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 0; display: flex; flex-direction: column; box-shadow: 0 14px 36px rgba(20, 60, 90, .26); overflow: hidden; font-size: 14px; }
.popover > section { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.popover > section + section, .tb-foot { border-top: 1px solid var(--line); }
.tb-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 14px; }
.tb-head b { font-family: var(--display); font-size: 16px; flex: 1; }
.tb-boat { width: 26px; height: 20px; }
.tb-icon { width: 28px; height: 28px; border-radius: 50%; border: 0; background: none; color: var(--muted); font-size: 17px; line-height: 1; padding: 0; }
.tb-icon:hover { background: var(--soft); color: var(--ink); }
.tb-free { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tb-free b { font-family: var(--display); font-size: 28px; font-weight: 700; }
.tb-status.crit { background: color-mix(in srgb, var(--risky) 10%, var(--card)); }
.tb-status.warn { background: color-mix(in srgb, var(--review) 12%, var(--card)); }
.tg-track { position: relative; height: 10px; border-radius: 99px; background: var(--soft); margin-top: 4px; }
.tg-track .z { position: absolute; top: 0; bottom: 0; opacity: .35; }
.tg-track .z.crit { left: 0; background: var(--risky); border-radius: 99px 0 0 99px; } .tg-track .z.warn { background: var(--review); } .tg-track .z.good { background: var(--safe); border-radius: 0 99px 99px 0; }
.tg-track .ghost { position: absolute; top: 2px; bottom: 2px; border-radius: 99px; background: repeating-linear-gradient(135deg, var(--accent) 0 4px, transparent 4px 7px); }
.tg-mark { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--st); border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--line); }
.tg-scale { position: relative; height: 16px; font-size: 11px; color: var(--muted); }
.tg-scale span { position: absolute; top: 2px; transform: translateX(-50%); }
.tg-scale span:first-child { transform: none; } .tg-scale span:last-child { transform: none; }
.tb-line { font-weight: 700; } .tb-line .muted { font-weight: 600; }
.tb-sub { display: flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.tl li { display: flex; justify-content: space-between; gap: 10px; } .tl-n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-more { color: var(--muted); }
.tb-toss { width: 100%; margin-top: 4px; }
.btn.calm { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 14%, var(--card)); }
.tb-c { text-align: center; margin-top: -2px; }
.popover > .tb-links { padding: 6px 6px; gap: 0; }
.tb-link { display: flex; justify-content: space-between; gap: 10px; padding: 7px 8px; border: 0; background: none; border-radius: 10px; text-align: left; font-weight: 700; width: 100%; }
button.tb-link:hover { background: var(--soft); } .tb-link.static { font-weight: 600; }
.tb-foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--soft); }
.tb-foot { flex-wrap: wrap; }
.tb-foot .note { flex: 1 1 auto; white-space: nowrap; }
.tb-foot .link, .tb-open, .tl .num, .tb-link .num { white-space: nowrap; }
@media (max-width: 600px) { .popover { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; max-height: calc(100vh - 20px); overflow-y: auto; } } .tb-open { padding: 5px 12px; font-size: 13px; }
.note { font-size: 13px; color: var(--muted); }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; }
.stage { position: relative; min-height: 330px; border-radius: 26px; overflow: hidden; background: linear-gradient(var(--sky-a), var(--sky-b)); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.bubble { position: absolute; left: 16px; right: 16px; top: 14px; max-width: 330px; z-index: 2; background: var(--bubble); border-radius: 18px; padding: 10px 14px; box-shadow: 0 4px 0 rgba(20, 60, 90, .1); font-weight: 700; }
.bubble::after { content: ""; position: absolute; left: 96px; bottom: -9px; width: 18px; height: 18px; background: var(--bubble); transform: rotate(45deg); border-radius: 3px; }
#boat { transition: transform 1s cubic-bezier(.3, 1.4, .5, 1); }
.bob { animation: bob 3.6s ease-in-out infinite; transform-origin: 0 0; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(5px) rotate(1.2deg); } }
.wave { animation: drift 7s linear infinite; }
.wave.slow { animation-duration: 11s; animation-direction: reverse; }
@keyframes drift { to { transform: translateX(-60px); } }
.crate-fly { animation: fly .75s ease-in forwards; }
@keyframes fly { 45% { transform: translate(60px, -60px) rotate(20deg); } 100% { transform: translate(170px, 120px) rotate(70deg); opacity: 0; } }
.helm { display: flex; flex-direction: column; gap: 12px; }
.make { background: var(--soft); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.make h3 { font-size: 17px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.flabel { font-size: 13px; font-weight: 800; color: var(--muted); }
.flabel-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.link.small { font-size: 13px; }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 10px; white-space: nowrap; flex: none; }
.link.small:disabled { color: var(--muted); text-decoration: none; cursor: default; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.5fr); gap: 3px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 7px 4px; font-weight: 800; font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.seg button:hover { background: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.areas { display: flex; flex-wrap: wrap; gap: 6px; }
.area { display: inline-flex; align-items: center; gap: 7px; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 5px 10px 5px 7px; font-weight: 800; font-size: 13.5px; color: var(--ink); }
.area .box { width: 17px; height: 17px; border-radius: 5px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.area .box svg { width: 11px; height: 11px; visibility: hidden; }
.area[aria-pressed="true"] { border-color: var(--accent); }
.area[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.area[aria-pressed="true"] .box svg { visibility: visible; }
.area small { color: var(--muted); font-weight: 700; font-size: 12.5px; }
.area.none { color: var(--muted); }
.flabel-note { width: 100%; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.meter-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.meter { height: 12px; border-radius: 99px; overflow: hidden; display: flex; background: repeating-linear-gradient(135deg, var(--card) 0 6px, var(--line) 6px 8px); }
.meter i { display: block; height: 100%; background: var(--safe); }
.meter i.picked { background: var(--accent); }
.gaprow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
/* Toss button: a crate that wants to jump, and the crates on deck answer when you point at it */
.toss { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 18px; border-radius: 16px; font-family: var(--display); font-size: 18px; font-weight: 600; box-shadow: 0 4px 0 var(--toss-edge); transition: transform .12s ease, box-shadow .12s ease; }
.toss:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 0 var(--toss-edge); }
.toss:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--toss-edge); }
.toss:disabled { box-shadow: none; }
.toss .tcrate { width: 30px; height: 26px; flex: none; transform-origin: 50% 100%; }
.toss:hover:not(:disabled) .tcrate, .toss:focus-visible .tcrate { animation: hop .7s ease-in-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-5px) rotate(-8deg); } 60% { transform: translateY(0) rotate(4deg); } }
.toss .tlabel { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
.toss .tmain { white-space: nowrap; }
@media (max-width: 520px) { .toss .tlong { display: none; } .toss .tcrate { width: 24px; height: 21px; } }
.toss .tlabel small { font-family: var(--body); font-size: 12px; font-weight: 700; opacity: .85; white-space: nowrap; text-align: left; }
.toss .splash { position: absolute; left: 0; right: 0; bottom: -2px; height: 10px; opacity: .25; pointer-events: none; }
.toss:hover:not(:disabled) .splash { animation: slosh 1.6s linear infinite; }
@keyframes slosh { to { transform: translateX(-24px); } }
.eager [data-crate] { animation: ready .6s ease-in-out infinite; }
.eager [data-crate]:nth-child(2n) { animation-delay: .15s; } .eager [data-crate]:nth-child(3n) { animation-delay: .3s; }
@keyframes ready { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.cta-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.pile-toggle { white-space: nowrap; }
.pile-toggle::after { content: " \25BE"; }
.pile-toggle[aria-expanded="true"]::after { content: " \25B4"; }
.big-free { font-family: var(--display); font-weight: 700; font-size: 58px; line-height: 1; }
.big-free small { font-size: 21px; font-weight: 600; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 800; padding: 1px 10px; border-radius: 999px; color: var(--st); border: 2px solid var(--st); white-space: nowrap; }
.safe, .good { --st: var(--safe); } .review, .warn { --st: var(--review); } .risky, .crit { --st: var(--risky); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 13px; font-weight: 800; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.peek { font-size: 14px; }
.pile-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 10px; align-items: center; padding: 6px 0; border-top: 2px dotted var(--line); font-size: 14px; }
.pile-row .sub { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.x { border: 0; background: var(--soft); border-radius: 50%; width: 26px; height: 26px; font-weight: 800; line-height: 1; padding: 0; }

/* Tabs */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px; }
.tab { flex: none; border: 2px solid transparent; background: transparent; border-radius: 14px; padding: 7px 15px; font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--card); border-color: var(--line); color: var(--ink); }
.tab .dot { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--hull); color: #3A1410; font: 800 12.5px/20px var(--body); text-align: center; }
.two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }

/* Question deck */
.q { display: flex; flex-direction: column; gap: 10px; }
.q-size { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; }
.facts { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 3px 10px; font-size: 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts { margin: 0; }
.q-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.riskx { border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; background: var(--soft); font-size: 14px; }
.riskx.risky { border-color: color-mix(in srgb, var(--risky) 55%, var(--line)); }
.riskx.review { border-color: color-mix(in srgb, var(--review) 60%, var(--line)); }
.riskx summary { cursor: pointer; font-weight: 800; }
.riskx[open] { display: flex; flex-direction: column; gap: 8px; }
.rscale { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.rs { border-radius: 10px; padding: 6px 8px; background: var(--card); border-top: 4px solid currentColor; opacity: .5; line-height: 1.25; min-width: 0; }
.rs b { display: block; font-size: 13px; color: var(--ink); } .rs span { display: block; font-size: 12px; color: var(--muted); }
.rs.safe { color: var(--safe); } .rs.review { color: var(--review); } .rs.risky { color: var(--risky); }
.rs.on { opacity: 1; box-shadow: 0 0 0 2px currentColor inset; }
.rx-sub { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
.rx-why, .rx-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.rx-steps li span { display: block; }
.rx-steps code { display: block; background: var(--card); border-radius: 8px; padding: 4px 8px; margin-top: 2px; }
.ack { display: flex; gap: 8px; align-items: flex-start; color: var(--risky); font-weight: 800; font-size: 14px; }
.ack input, .toggle input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
details > summary { cursor: pointer; font-weight: 800; }
.grp { border-top: 2px dotted var(--line); padding-block: 8px; }
.grp:first-of-type { border-top: 0; }
.grp > summary { display: flex; justify-content: space-between; gap: 10px; list-style: none; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary::before { content: "+"; font-family: var(--mono); color: var(--accent); margin-right: 2px; }
.grp[open] > summary::before { content: "-"; }
.grp > summary span:first-of-type { flex: 1; min-width: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; padding: 7px 0 7px 16px; font-size: 14px; }
.item .sub { color: var(--muted); font-size: 12.5px; font-weight: 600; grid-column: 1 / -1; overflow-wrap: anywhere; }
.grp-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 4px 16px; }
/* Item rows: one quiet line each, details on demand */
.irow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 0 10px; align-items: start; padding: 10px 0; border-top: 2px dotted var(--line); }
.irow > input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); }
.irow .lockic { width: 18px; height: 18px; margin-top: 3px; }
.irow-main { border: 0; background: none; padding: 0; text-align: left; min-width: 0; color: var(--ink); display: flex; flex-direction: column; gap: 2px; }
.irow-main .iname { font-weight: 800; font-size: 14.5px; display: flex; gap: 6px; align-items: baseline; }
.irow-main .iname::after { content: "\25BE"; font-size: 11px; color: var(--muted); transition: transform .15s; }
.irow-main[aria-expanded="true"] .iname::after { transform: rotate(180deg); }
.irow-main:hover .iname { color: var(--accent); }
.imeta { font-size: 12.5px; color: var(--muted); font-weight: 600; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; }
.rdot { width: 8px; height: 8px; border-radius: 50%; background: var(--st); display: inline-block; }
.isize { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; font-weight: 800; font-size: 14.5px; min-width: 72px; }

        '<div class="ob-gauge"><div class="track"><i class="z crit" style="width:' + x(pr.crit) + '%"></i><i class="z warn" style="left:' + x(pr.crit) + '%;width:' + (x(pr.low) - x(pr.crit)) + '%"></i><i class="z good" style="left:' + x(pr.low) + '%"></i><span class="you" style="left:calc(' + x(f) + '% - 2px)" title="' + T('ob.you', 'You') + '"></span></div>' +
        '<div class="lbl num"><span>' + T('ob.zero', '0 GB free') + '</span><span>' + MAX + '+ ' + unitGB() + '</span></div></div>' +
        '<p class="ob-verdict">' + T('ob.now', 'Right now:') + ' <span style="color:' + stt[1] + '">' + stt[0] + '</span> <span class="muted num">(' + gb(f) + ' ' + T('ob.free', 'free') + ')</span></p>';
    }
    if (st === 2) {
      return '<span class="ob-kicker">' + T('ob.k2', 'Step 2 of 3') + '</span><h2 id="ob-title">' + T('ob.h2', 'Where do you keep your code?') + '</h2><p>' + T('ob.p2', 'I found these. I’ll look for worktrees, node_modules and build output inside them. Sizes and dates only, never file contents.') + '</p>' +
        '<div class="ob-folders">' + OB.folders.map(function (fo, n) {
          return '<label class="ob-folder"><input type="checkbox" data-ob-folder="' + n + '"' + (fo.on ? ' checked' : '') + '><span class="fi" aria-hidden="true"></span><span><span class="fp">' + esc(fo.p) + '</span><br><span class="fm">' + esc(obMeta(fo)) + '</span></span><span class="fs num">' + gbi(fo.gb) + '</span></label>'; }).join('') +
        (OB.adding ? '<form class="ob-addform" id="ob-addform"><input id="ob-addpath" placeholder="~/somewhere/else" aria-label="' + T('ob.path', 'Folder path') + '"><button class="btn primary" type="submit">' + T('ob.addb', 'Add') + '</button><button class="btn" type="button" data-ob="cancel-add">' + T('ob.cancel', 'Cancel') + '</button></form>' : '<button class="ob-add" data-ob="add">' + T('ob.addf', '+ Add another folder') + '</button>') + '</div>' +
        '<div class="ob-sub">' + T('ob.tools', 'Tools I can ask') + '</div><div class="ob-tools">' + OB_TOOLS.map(function (t) { return '<span class="ob-tool' + (t[1] ? ' on' : '') + '"' + (t[1] ? '' : ' title="' + T('ob.notinst', 'Not installed') + '"') + '>' + t[0] + '</span>'; }).join('') + '</div>';
    }
    if (st === 3) return '<span class="ob-kicker">' + T('ob.k3', 'Step 3 of 3') + '</span><h2 id="ob-title">' + T('ob.h3', 'What I read, and what I never do.') + '</h2>' +
      '<div class="ob-two"><div class="ob-list yes"><h3>' + T('ob.read', 'I read') + '</h3><ul><li>' + T('ob.r1', 'Free space on your disk, every 5 minutes') + '</li><li>' + T('ob.r2', 'Reports from Docker, Git, pnpm, pip and friends') + '</li><li>' + T('ob.r3', 'Sizes and dates in the folders you chose') + '</li></ul></div>' +
      '<div class="ob-list no"><h3>' + T('ob.never', 'I never') + '</h3><ul><li>' + T('ob.n1', 'Remove anything without a plan you confirm') + '</li><li>' + T('ob.n2', 'Send your data anywhere') + '</li><li>' + T('ob.n3', 'Touch uncommitted or unpushed work') + '</li></ul></div></div>' +
      '<div class="ob-switches"><label class="ob-switch"><span>' + T('ob.sw1', 'Show free space in the menu bar') + '<small>' + T('ob.sw1.s', 'One glance, no window.') + '</small></span><input class="tg-sw" type="checkbox" data-ob-sw="menubar"' + (OB.sw.menubar ? ' checked' : '') + '></label>' +
      '<label class="ob-switch"><span>' + T('ob.sw2', 'Open Freeboard at login') + '<small>' + T('ob.sw2.s', 'So the warnings actually reach you.') + '</small></span><input class="tg-sw" type="checkbox" data-ob-sw="login"' + (OB.sw.login ? ' checked' : '') + '></label>' +
      '<div class="ob-switch"><span>' + T('ob.fda', 'Mail, Photos and app data') + '<small>' + T('ob.fda.s', 'macOS hides these until you allow Full Disk Access. Optional.') + '</small></span><button class="btn" data-ob="fda"' + (OB.fdaLater ? ' disabled' : '') + '>' + (OB.fdaLater ? T('ob.later2', 'Ask me later ✓') : T('ob.later', 'Later')) + '</button></div></div>';
    var found = OB_FOUND.slice(0, OB.shown), places = T('ob.places', 'Docker|git worktrees|node_modules|Xcode|Ollama|Homebrew|pip and pnpm caches').split('|');
    return '<span class="ob-kicker">' + T('ob.k4', 'First look') + '</span><h2 id="ob-title">' + (OB.done ? T('ob.h4.done', 'Here’s what I found.') : T('ob.h4.run', 'Taking a first look…')) + '</h2>' +
      '<div class="ob-scan"><div class="ob-prog" role="progressbar" aria-valuemin="0" aria-valuemax="49" aria-valuenow="' + OB.scan + '"><i style="width:' + (OB.scan / 49 * 100).toFixed(1) + '%"></i></div><div class="ob-scanline"><span>' + (OB.done ? T('ob.checked', 'Checked 49 places') : T('ob.checking', 'Checking {x}', { x: places[Math.min(places.length - 1, Math.floor(OB.scan / 7.1))] })) + '</span><span class="num">' + OB.scan + ' / 49</span></div></div>' +
      '<div class="ob-found">' + found.map(function (x) { return '<div><span>' + esc(x[0] ? T(x[0], x[1]) : x[1]) + '</span><span class="num">' + gb(x[2]) + '</span></div>'; }).join('') + '</div>' +
      (OB.done ? '<div class="ob-total"><b class="num">' + gb(obTotal()) + '</b><span>' + T('ob.total', 'you could get back.') + ' <span class="muted">' + T('ob.rebuild', '{x} of it rebuilds by itself.', { x: gb(18.7 + 14.8 + 11.3 + 9.2) }) + '</span></span></div>' : '');
  }
  function obLangSel() {
    return '<label class="ob-lang" title="' + T('ob.lang', 'Language') + '"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2 10h16M10 2c2.6 2.4 2.6 13.6 0 16M10 2c-2.6 2.4-2.6 13.6 0 16" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span class="sr-only">' + T('ob.lang', 'Language') + '</span><select id="ob-lang-sel">' +
      LANGS.map(function (l) { return '<option value="' + l + '"' + (LG() === l ? ' selected' : '') + ' lang="' + l + '">' + LANG_NAMES[l] + '</option>'; }).join('') + '</select></label>';
  }
  function obRender() {
    var r = $('ob-root'); if (!r || !OB) return; var st = OB.step, steps = obSteps();
    document.documentElement.lang = LG();
    var route = '<ol class="ob-route" aria-label="' + T('ob.progress', 'Setup progress') + '">' + steps.map(function (n, i) {
      return '<li class="' + (i < st ? 'done' : i === st ? 'on' : '') + '"' + (i === st ? ' aria-current="step"' : '') + '><span class="buoy" title="' + n + '">' + (i < st ? '✓' : i + 1) + '</span>' + (i < steps.length - 1 ? '<span class="leg"></span>' : '') + '</li>'; }).join('') + '</ol>';
    var next = st === 0 ? T('ob.next0', 'Let’s set sail') : st === 3 ? T('ob.next3', 'Start first look') : st === 4 ? (OB.done ? T('ob.next4', 'Show me') : T('ob.next4run', 'Looking…')) : T('ob.next', 'Next');
    var nf = OB.folders.filter(function (x) { return x.on; }).length;
    var hint = st === 2 ? T(nf === 1 ? 'ob.fchosen1' : 'ob.fchosenN', nf === 1 ? '{n} folder chosen' : '{n} folders chosen', { n: nf }) : st === 4 && OB.done ? T('ob.nothing', 'Nothing is removed until you confirm.') : '';
    r.innerHTML = '<div class="ob"><div class="ob-sea"><p class="ob-bubble" aria-live="polite">' + obBubble() + '</p>' + obSea() + '</div>' +
      '<div class="ob-side"><div class="ob-top">' + route + (st === 0 ? obLangSel() : '') + (st < 4 ? '<button class="ob-skip" data-ob="skip">' + T('ob.skip', 'Skip setup') + '</button>' : '') + '</div>' +
      '<div class="ob-body">' + obBody() + '</div>' +
      '<div class="ob-foot">' + (st > 0 && st < 4 ? '<button class="btn" data-ob="back">' + T('ob.back', 'Back') + '</button>' : '') + '<span class="grow hint">' + hint + '</span>' +
      '<button class="btn primary" id="ob-next" data-ob="next"' + (st === 4 && !OB.done ? ' disabled' : '') + '>' + next + '</button></div></div></div>';
  }
  function obScan() {
    OB.scan = 0; OB.shown = 0; OB.done = false; obRender();
    var tick = function () {
      if (!OB) return;
      OB.scan = Math.min(49, OB.scan + (reduced ? 49 : 2));
      OB.shown = Math.min(OB_FOUND.length, Math.floor(OB.scan / 8));
      if (OB.scan >= 49) { OB.done = true; OB.shown = OB_FOUND.length; }
      obRender(); if (!OB.done) setTimeout(tick, 110); else { var n = $('ob-next'); if (n) n.focus(); }
    };
    setTimeout(tick, reduced ? 0 : 300);
  }
  document.addEventListener('click', function (e) {
    if (!OB) return; var b = e.target.closest && e.target.closest('[data-ob],[data-ob-preset]'); if (!b) return;
    if (b.dataset.obPreset) { OB.preset = b.dataset.obPreset; obRender(); return; }
    var a = b.dataset.ob;
    if (a === 'skip') obClose(false);
    else if (a === 'back') { OB.step--; obRender(); }
    else if (a === 'next') { if (OB.step === 4) { obClose(true); return; } OB.step++; if (OB.step === 4) obScan(); else obRender(); var nx = $('ob-next'); if (nx) nx.focus(); }
    else if (a === 'add') { OB.adding = true; obRender(); $('ob-addpath').focus(); }
    else if (a === 'cancel-add') { OB.adding = false; obRender(); }
    else if (a === 'fda') { OB.fdaLater = true; b.textContent = T('ob.later2', 'Ask me later ✓'); b.disabled = true; }
  });
  document.addEventListener('change', function (e) {
    if (!OB) return; var t = e.target;
    if (t.dataset.obFolder) { OB.folders[+t.dataset.obFolder].on = t.checked; obRender(); }
    if (t.dataset.obSw) OB.sw[t.dataset.obSw] = t.checked;
    if (t.id === 'ob-lang-sel') { setLangPref(t.value); obRender(); renderAll(); var sel = $('ob-lang-sel'); if (sel) sel.focus(); }
  });
  document.addEventListener('submit', function (e) {
    if (!OB || e.target.id !== 'ob-addform') return; e.preventDefault();
    var v = $('ob-addpath').value.trim(); if (v) OB.folders.push({ p: v, kind: 'new', gb: 0, on: true }); OB.adding = false; obRender();
  });
  document.addEventListener('keydown', function (e) { if (OB && e.key === 'Escape' && OB.step < 4) obClose(false); });
  if (location.hash === '#welcome') setTimeout(obOpen, 0);
  window.addEventListener('hashchange', function () { if (location.hash === '#welcome' && !OB) obOpen(); });

  document.documentElement.lang = LG();
  waves();
  renderAll();
})();
</script>
