<title>Freeboard Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout concept: a toy harbor. Dinghy, a small boat, sits lower as the disk fills, and crates on deck are the space you can throw overboard. */
:root {
  --bg: #F1FAFB; --card: #FFFFFF; --soft: #E3F4F6; --ink: #1E3A52; --muted: #526B84; --line: #CDE3E8;
  --accent: #0C7786; --accent-ink: #FFFFFF; --toss-edge: #075460;
  --sky-a: #BCE9F7; --sky-b: #E9FAF6; --sun: #FFD76B; --star: 0; --cloud: #FFFFFF;
  --sea-a: #5CCBDD; --sea-b: #2FA9C5; --hull: #FF8B7B; --hull-dark: #E96A5C; --cabin: #FFFFFF; --crate: #FFC867; --crate-edge: #DE9A2C; --boat-ink: #23405A;
  --safe: #17805A; --review: #9A5F07; --risky: #C2334A; --bubble: #FFFFFF;
  --t-a: #A8E3D0; --t-b: #A9D8F5; --t-c: #FFD79A; --t-d: #F7B9C8; --t-e: #CFC3F5; --t-f: #C9EBA8; --t-g: #BFE7EC; --t-h: #D5DCEB; --t-ink: #1E3A52;
  --display: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1C31; --card: #172A47; --soft: #1F3558; --ink: #EAF2FF; --muted: #AFC0DA; --line: #2D4468;
  --accent: #72DCE9; --accent-ink: #082631; --toss-edge: #2E9BAA;
  --sky-a: #0E1A38; --sky-b: #233B6B; --sun: #F5EBC4; --star: 1; --cloud: #33497A;
  --sea-a: #2B8BAA; --sea-b: #17607F; --bubble: #243C63;
  --safe: #70DDAA; --review: #F3C266; --risky: #FF97A5; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1C31; --card: #172A47; --soft: #1F3558; --ink: #EAF2FF; --muted: #AFC0DA; --line: #2D4468;
  --accent: #72DCE9; --accent-ink: #082631; --toss-edge: #2E9BAA;
  --sky-a: #0E1A38; --sky-b: #233B6B; --sun: #F5EBC4; --star: 1; --cloud: #33497A;
  --sea-a: #2B8BAA; --sea-b: #17607F; --bubble: #243C63;
  --safe: #70DDAA; --review: #F3C266; --risky: #FF97A5; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 600 15px/1.5 var(--body); }
.page { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-block: 12px 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 25px; } h3 { font-size: 18px; }
p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.btn { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 8px 14px; font-weight: 800; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { padding: 12px 18px; font-size: 17px; width: 100%; font-family: var(--display); font-weight: 600; }
.btn.bad { border-color: var(--risky); color: var(--risky); }
.link { border: 0; background: none; padding: 2px 0; color: var(--accent); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 18px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.brand { font-family: var(--display); font-size: 25px; font-weight: 700; }
.top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--muted); }
.sim { display: flex; align-items: center; gap: 6px; }
input[type="range"] { accent-color: var(--accent); max-width: 120px; }
.tray { position: relative; }
.tray-btn { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 3px 12px; font-weight: 800; }
.icon-btn { border: 2px solid var(--line); background: var(--card); border-radius: 50%; width: 36px; height: 36px; font-size: 17px; line-height: 1; padding: 0; color: var(--ink); }
.popover { position: absolute; right: 0; top: calc(100% + 8px); z-index: 6; width: min(280px, calc(100vw - 32px)); background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 28px rgba(20, 60, 90, .22); }
.note { font-size: 13px; color: var(--muted); }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; }
.stage { position: relative; min-height: 330px; border-radius: 26px; overflow: hidden; background: linear-gradient(var(--sky-a), var(--sky-b)); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.bubble { position: absolute; left: 16px; right: 16px; top: 14px; max-width: 330px; z-index: 2; background: var(--bubble); border-radius: 18px; padding: 10px 14px; box-shadow: 0 4px 0 rgba(20, 60, 90, .1); font-weight: 700; }
.bubble::after { content: ""; position: absolute; left: 96px; bottom: -9px; width: 18px; height: 18px; background: var(--bubble); transform: rotate(45deg); border-radius: 3px; }
#boat { transition: transform 1s cubic-bezier(.3, 1.4, .5, 1); }
.bob { animation: bob 3.6s ease-in-out infinite; transform-origin: 0 0; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(5px) rotate(1.2deg); } }
.wave { animation: drift 7s linear infinite; }
.wave.slow { animation-duration: 11s; animation-direction: reverse; }
@keyframes drift { to { transform: translateX(-60px); } }
.crate-fly { animation: fly .75s ease-in forwards; }
@keyframes fly { 45% { transform: translate(60px, -60px) rotate(20deg); } 100% { transform: translate(170px, 120px) rotate(70deg); opacity: 0; } }
.helm { display: flex; flex-direction: column; gap: 12px; }
.make { background: var(--soft); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.make h3 { font-size: 17px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.flabel { font-size: 13px; font-weight: 800; color: var(--muted); }
.flabel-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.link.small { font-size: 13px; }
.link.small:disabled { color: var(--muted); text-decoration: none; cursor: default; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 7px 4px; font-weight: 800; font-size: 14px; color: var(--ink); white-space: nowrap; }
.seg button:hover { background: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.areas { display: flex; flex-wrap: wrap; gap: 6px; }
.area { display: inline-flex; align-items: center; gap: 7px; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 5px 10px 5px 7px; font-weight: 800; font-size: 13.5px; color: var(--ink); }
.area .box { width: 17px; height: 17px; border-radius: 5px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.area .box svg { width: 11px; height: 11px; visibility: hidden; }
.area[aria-pressed="true"] { border-color: var(--accent); }
.area[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.area[aria-pressed="true"] .box svg { visibility: visible; }
.area small { color: var(--muted); font-weight: 700; font-size: 12.5px; }
.area.none { color: var(--muted); }
.flabel-note { width: 100%; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.meter-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.meter { height: 12px; border-radius: 99px; overflow: hidden; display: flex; background: repeating-linear-gradient(135deg, var(--card) 0 6px, var(--line) 6px 8px); }
.meter i { display: block; height: 100%; background: var(--safe); }
.meter i.picked { background: var(--accent); }
.gaprow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
/* Toss button: a crate that wants to jump, and the crates on deck answer when you point at it */
.toss { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 18px; border-radius: 16px; font-family: var(--display); font-size: 18px; font-weight: 600; box-shadow: 0 4px 0 var(--toss-edge); transition: transform .12s ease, box-shadow .12s ease; }
.toss:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 0 var(--toss-edge); }
.toss:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--toss-edge); }
.toss:disabled { box-shadow: none; }
.toss .tcrate { width: 30px; height: 26px; flex: none; transform-origin: 50% 100%; }
.toss:hover:not(:disabled) .tcrate, .toss:focus-visible .tcrate { animation: hop .7s ease-in-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-5px) rotate(-8deg); } 60% { transform: translateY(0) rotate(4deg); } }
.toss .tlabel { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
.toss .tmain { white-space: nowrap; }
@media (max-width: 520px) { .toss .tlong { display: none; } .toss .tcrate { width: 24px; height: 21px; } }
.toss .tlabel small { font-family: var(--body); font-size: 12px; font-weight: 700; opacity: .85; white-space: nowrap; text-align: left; }
.toss .splash { position: absolute; left: 0; right: 0; bottom: -2px; height: 10px; opacity: .25; pointer-events: none; }
.toss:hover:not(:disabled) .splash { animation: slosh 1.6s linear infinite; }
@keyframes slosh { to { transform: translateX(-24px); } }
.eager [data-crate] { animation: ready .6s ease-in-out infinite; }
.eager [data-crate]:nth-child(2n) { animation-delay: .15s; } .eager [data-crate]:nth-child(3n) { animation-delay: .3s; }
@keyframes ready { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.cta-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.pile-toggle { white-space: nowrap; }
.pile-toggle::after { content: " \25BE"; }
.pile-toggle[aria-expanded="true"]::after { content: " \25B4"; }
.big-free { font-family: var(--display); font-weight: 700; font-size: 58px; line-height: 1; }
.big-free small { font-size: 21px; font-weight: 600; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 800; padding: 1px 10px; border-radius: 999px; color: var(--st); border: 2px solid var(--st); white-space: nowrap; }
.safe, .good { --st: var(--safe); } .review, .warn { --st: var(--review); } .risky, .crit { --st: var(--risky); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 13px; font-weight: 800; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.peek { font-size: 14px; }
.pile-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 10px; align-items: center; padding: 6px 0; border-top: 2px dotted var(--line); font-size: 14px; }
.pile-row .sub { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.x { border: 0; background: var(--soft); border-radius: 50%; width: 26px; height: 26px; font-weight: 800; line-height: 1; padding: 0; }

/* Tabs */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px; }
.tab { flex: none; border: 2px solid transparent; background: transparent; border-radius: 14px; padding: 7px 15px; font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--card); border-color: var(--line); color: var(--ink); }
.tab .dot { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--hull); color: #3A1410; font: 800 12.5px/20px var(--body); text-align: center; }
.two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }

/* Question deck */
.q { display: flex; flex-direction: column; gap: 10px; }
.q-size { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; }
.facts { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 3px 10px; font-size: 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts { margin: 0; }
.q-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ack { display: flex; gap: 8px; align-items: flex-start; color: var(--risky); font-weight: 800; font-size: 14px; }
.ack input, .toggle input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
details > summary { cursor: pointer; font-weight: 800; }
.grp { border-top: 2px dotted var(--line); padding-block: 8px; }
.grp:first-of-type { border-top: 0; }
.grp > summary { display: flex; justify-content: space-between; gap: 10px; list-style: none; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary::before { content: "+"; font-family: var(--mono); color: var(--accent); margin-right: 2px; }
.grp[open] > summary::before { content: "-"; }
.grp > summary span:first-of-type { flex: 1; min-width: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; padding: 7px 0 7px 16px; font-size: 14px; }
.item .sub { color: var(--muted); font-size: 12.5px; font-weight: 600; grid-column: 1 / -1; overflow-wrap: anywhere; }
.grp-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 4px 16px; }
/* Item rows: one quiet line each, details on demand */
.irow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 0 10px; align-items: start; padding: 10px 0; border-top: 2px dotted var(--line); }
.irow > input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); }
.irow .lockic { width: 18px; height: 18px; margin-top: 3px; }
.irow-main { border: 0; background: none; padding: 0; text-align: left; min-width: 0; color: var(--ink); display: flex; flex-direction: column; gap: 2px; }
.irow-main .iname { font-weight: 800; font-size: 14.5px; display: flex; gap: 6px; align-items: baseline; }
.irow-main .iname::after { content: "\25BE"; font-size: 11px; color: var(--muted); transition: transform .15s; }
.irow-main[aria-expanded="true"] .iname::after { transform: rotate(180deg); }
.irow-main:hover .iname { color: var(--accent); }
.imeta { font-size: 12.5px; color: var(--muted); font-weight: 600; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; }
.rdot { width: 8px; height: 8px; border-radius: 50%; background: var(--st); display: inline-block; }
.isize { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; font-weight: 800; font-size: 14.5px; min-width: 72px; }
.szbar { display: block; width: 72px; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.szbar i { display: block; height: 100%; background: var(--st, var(--accent)); border-radius: 99px; }
.idetail { grid-column: 2 / -1; margin-top: 10px; background: var(--soft); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.idetail .facts { font-size: 13.5px; }
.iactions { display: flex; flex-wrap: wrap; gap: 8px; }
.iactions .btn { padding: 6px 14px; font-size: 14px; }
.grp-tools { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 6px 0 2px 16px; }
.pilebar { position: sticky; bottom: 0; margin: 10px -18px -18px; padding: 10px 18px; background: var(--card); border-top: 2px solid var(--line); border-radius: 0 0 20px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; }
/* Confirmation sheet */
.sheet.framed { width: min(580px, 100%); padding: 0; gap: 0; }
.cf-sum { display: flex; flex-direction: column; gap: 6px; }
.cf-big { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.1; }
.cf-big small { font-size: 16px; color: var(--muted); font-weight: 600; }
.cf-flags { display: flex; flex-wrap: wrap; gap: 6px; }
.cf-flag { font-size: 12.5px; font-weight: 800; border-radius: 999px; padding: 2px 10px; background: var(--soft); }
.cf-flag.bad { background: transparent; color: var(--risky); border: 2px solid var(--risky); }
.cf-item { border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.cf-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.cf-top b { font-size: 15px; } .cf-top .num { font-weight: 800; }
.cf-lines { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 3px 10px; font-size: 13px; margin: 0; }
.cf-lines dt { color: var(--muted); } .cf-lines dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.cf-parts summary { font-size: 13px; color: var(--accent); }
.cf-parts ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; columns: 2; }
.cf-safe { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.cf-safe svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.cf-list { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 460px) { .cf-lines { grid-template-columns: minmax(0, 1fr); } .cf-parts ul { columns: 1; } .isize { min-width: 0; } .szbar { width: 52px; } }
/* Cleanup run: a little 3D deck where crates hop off one by one */
.voyage { position: relative; height: 210px; border-radius: 20px; overflow: hidden; background: linear-gradient(var(--sky-a), var(--sky-b)); perspective: 700px; }
.voyage .vsea { position: absolute; left: 0; width: 100%; bottom: 0; height: 64px; }
.voyage .hull { position: absolute; left: 50%; bottom: 40px; width: 230px; height: 46px; margin-left: -150px; }
.deck { position: absolute; left: 50%; bottom: 84px; margin-left: -120px; width: 190px; height: 90px; transform-style: preserve-3d; transform: rotateX(-14deg) rotateY(-24deg); }
.cube { position: absolute; width: 30px; height: 30px; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3, 1.4, .5, 1), opacity .3s; }
.cube i { position: absolute; inset: 0; border: 2px solid var(--crate-edge); border-radius: 5px; background: linear-gradient(transparent 31%, var(--crate-edge) 31% 37%, transparent 37% 63%, var(--crate-edge) 63% 69%, transparent 69%), var(--crate); }
.cube i:nth-child(1) { transform: translateZ(15px); }
.cube i:nth-child(2) { transform: rotateY(180deg) translateZ(15px); }
.cube i:nth-child(3) { transform: rotateY(90deg) translateZ(15px); filter: brightness(.88); }
.cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(15px); filter: brightness(.88); }
.cube i:nth-child(5) { transform: rotateX(90deg) translateZ(15px); filter: brightness(1.08); }
.cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(15px); filter: brightness(.75); }
.cube.lift { transform: var(--at) translateY(-26px) rotateY(25deg); }
.cube.gone { animation: overboard .8s cubic-bezier(.45, 0, .7, 1) forwards; }
@keyframes overboard { 0% { transform: var(--at) translateY(-26px); } 45% { transform: var(--at) translate3d(150px, -70px, 30px) rotateX(200deg) rotateY(120deg); } 100% { transform: var(--at) translate3d(240px, 120px, 40px) rotateX(420deg) rotateY(260deg); opacity: 0; } }
.cube.stay i { border-color: var(--review); }
.cube.stay { animation: nope .5s ease-in-out; }
@keyframes nope { 0%, 100% { transform: var(--at); } 25% { transform: var(--at) rotateZ(-12deg); } 75% { transform: var(--at) rotateZ(12deg); } }
.cube.stuck i { border-color: var(--risky); }
.cube.stuck { animation: stuck .45s steps(4) 2; }
@keyframes stuck { 50% { transform: var(--at) translateX(4px); } }
.splash { position: absolute; bottom: 30px; right: 54px; width: 70px; height: 24px; pointer-events: none; }

    var und = S.removed ? '<div class="undo"><span>' + (S.removed.kind === 'scan' ? 'No longer scanning ' : 'No longer skipping ') + '<span class="mono">' + esc(S.removed.f.p) + '</span></span><button class="mini" id="undo-rm" data-fundo="1">Undo</button></div>' : '';
    var scanDesc = S.scanning ? (S.scanning === 'quick' ? 'Quick scan running…' : 'Deep scan running…') : 'Last scan ' + S.lastScan + '. Quick scans run every hour.';
    return '<div class="st-head"><h2 id="sheet-title">Settings</h2><button class="icon-x" data-act="close" aria-label="Close settings">&times;</button></div>' +
      '<div class="st-body">' +
      '<section class="st-sec" aria-labelledby="st-warn"><h3 id="st-warn">When Dinghy warns you</h3><p>Dinghy gets worried in the amber zone and panics in the red one.</p>' + zone +
        '<div class="limit"><span class="sw" style="background:var(--review)"></span><span><b>Warn me</b><small>Low, Dinghy looks worried</small></span>' + step('low', S.low, S.crit + 5, 60, 5) + '</div>' +
        '<div class="limit"><span class="sw" style="background:var(--risky)"></span><span><b>Warn me urgently</b><small>Critical, Dinghy panics</small></span>' + step('crit', S.crit, 2, S.low - 2, 1) + '</div></section>' +
      '<section class="st-sec" aria-labelledby="st-scan"><h3 id="st-scan">Folders I scan</h3><p>Freeboard looks for projects, worktrees and caches here.</p>' +
        '<div class="st-list">' + (S.folders.length ? S.folders.map(function (x, n) { return folderRow(x, 'scan', n); }).join('') : '<div class="empty">No folders yet. Add one, or Freeboard only checks tool caches.</div>') + '</div>' +
        (S.removed && S.removed.kind === 'scan' ? und : '') +
        (S.suggest.length ? '<div class="st-sub">Found outside these folders</div><div class="st-list">' + S.suggest.map(function (x, n) { return folderRow(x, 'sugg', n); }).join('') + '</div>' : '') +
        addLine('scan', 'Add a folder') + '</section>' +
      '<section class="st-sec" aria-labelledby="st-skip"><h3 id="st-skip">Folders I skip</h3><p>Freeboard never looks inside these.</p>' +
        '<div class="st-list">' + (S.skip.length ? S.skip.map(function (x, n) { return folderRow(x, 'skip', n); }).join('') : '<div class="empty">Nothing skipped yet.</div>') + '</div>' +
        (S.removed && S.removed.kind === 'skip' ? und : '') +
        addLine('skip', 'Skip a folder') + '</section>' +
      '<section class="st-sec" aria-labelledby="st-lock"><h3 id="st-lock">Always protected</h3><p>Freeboard never removes these, whatever you choose.</p><div class="lockchips"><span>' + LOCK_SVG + 'System folders</span><span>' + LOCK_SVG + 'Repository roots</span><span>' + LOCK_SVG + '.git folders</span><span>' + LOCK_SVG + 'Folders you skip</span></div></section>' +
      '<section class="st-sec" aria-labelledby="st-run"><h3 id="st-run">Scanning</h3><p id="scan-status" aria-live="polite">' + scanDesc + '</p><div class="scanrow">' +
        '<button class="scanbtn" id="scan-quick" data-scan="quick"' + (S.scanning ? ' disabled' : '') + '><b>Quick scan</b><small>Known caches and tools, about 10 seconds</small></button>' +
        '<button class="scanbtn" id="scan-deep" data-scan="deep"' + (S.scanning ? ' disabled' : '') + '><b>Deep scan</b><small>Every file in your folders, about a minute</small></button></div></section>' +
      '</div><div class="st-foot"><button class="btn primary" id="settings-done" data-act="close">Done</button></div>';
  }
  function renderSettings() {
    var sh = $('sheet'); if (!sh || S.sheet !== 'settings') return;
    var top = sh.scrollTop, f = document.activeElement && document.activeElement.id;
    sh.innerHTML = settingsHTML(); sh.scrollTop = top;
    if (f && $(f) && !$(f).disabled) $(f).focus({ preventScroll: true }); else if (S.adding && $('add-' + S.adding + '-path')) $('add-' + S.adding + '-path').focus();
  }
  function settingsSheet() {
    S.sheet = 'settings'; S.adding = null; S.removed = null;
    openSheet(settingsHTML(), 'settings');
  }
  async function runScan(kind) {
    S.scanning = kind; renderSettings();
    await sleep(reduced ? 100 : kind === 'quick' ? 1200 : 2400);
    S.scanning = null; S.lastScan = 'just now'; renderSettings();
  }

  function renderAll() {
    var f = document.activeElement && document.activeElement.id;
    renderHero(); renderTidy(); renderMap(); renderLog();
    if (f && $(f)) $(f).focus({ preventScroll: true });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (e.target.id === 'scrim' && !S.running) { closeSheet(); return; }
    if (!b) { if (S.tray && !e.target.closest('.popover')) { S.tray = false; renderHero(); } return; }
    if (b.id === 'tray-btn') { S.tray = !S.tray; renderHero(); return; }
    if (S.tray && !b.closest('.popover')) { S.tray = false; renderHero(); }
    if (b.dataset.goal) { S.goal = b.dataset.goal === 'all' ? 'all' : +b.dataset.goal; S.manual = null; S.excl = {}; renderAll(); return; }
    if (b.dataset.area !== undefined) {
      var ar = b.dataset.area, names = safeAreas();
      if (!ar) S.areas = {};
      else {
        if (!anyArea()) { S.areas = {}; names.forEach(function (g) { S.areas[g] = true; }); }
        if (S.areas[ar]) delete S.areas[ar]; else S.areas[ar] = true;
        if (names.every(function (g) { return S.areas[g]; })) S.areas = {};
        else if (!anyArea()) S.areas = { __none: true };
      }
      S.manual = null; renderAll(); return;
    }
    if (b.dataset.now) { confirmSheet([byId(b.dataset.now)]); return; }
    if (b.dataset.keep) { var k = b.dataset.keep; if (S.kept[k]) delete S.kept[k]; else { S.kept[k] = true; delete S.queued[k]; if (S.manual) delete S.manual[k]; } renderAll(); return; }
    if (b.dataset.clean) { var c = b.dataset.clean.split(':'); confirmSheet(usable(c[0], c[1])); return; }
    if (b.dataset.add) { var d = b.dataset.add.split(':'); usable(d[0], d[1]).forEach(function (i) { addToPile(i.id); }); renderAll(); return; }
    if (b.dataset.tab) { S.tab = b.dataset.tab; renderHero(); return; }
    if (b.dataset.tile) { S.tile = b.dataset.tile; renderMap(); var d = $('tile-detail'); if (d && window.innerWidth < 800) d.scrollIntoView({ block: 'nearest' }); return; }
    if (b.dataset.out) { takeOut(b.dataset.out); renderAll(); return; }
    if (b.dataset.q) {
      var q = deck()[0]; if (!q) return;
      if (b.dataset.q === 'toss') addToPile(q.id);
      if (b.dataset.q === 'keep') S.kept[q.id] = true;
      if (b.dataset.q === 'later') S.later[q.id] = true;
      renderAll(); return;
    }
    if (b.dataset.spot) { S.spots[b.dataset.spot] = 'scan'; renderAll(); return; }
    if (b.dataset.whyMore) { S.whyMore[b.dataset.whyMore] = !S.whyMore[b.dataset.whyMore]; renderMap(); return; }
    if (b.dataset.spotAll) { SPOTS.forEach(function (x) { if (x.cause === b.dataset.spotAll && !S.spots[x.id]) S.spots[x.id] = 'scan'; }); renderAll(); return; }
    if (b.dataset.spotMine) { S.spots[b.dataset.spotMine] = 'mine'; renderAll(); return; }
    if (b.dataset.expand) { var ek = b.dataset.expand; S.expanded[ek] = !S.expanded[ek]; renderAll(); return; }
    if (b.dataset.step) { var st = b.dataset.step.split(':'); S[st[0]] += +st[1]; renderSettings(); renderHero(); return; }
    if (b.dataset.frm) { var fr = b.dataset.frm.split(':'), list = fr[0] === 'scan' ? S.folders : S.skip; S.removed = { kind: fr[0], f: list.splice(+fr[1], 1)[0], at: +fr[1] }; renderSettings(); return; }
    if (b.dataset.fundo) { var rm = S.removed; (rm.kind === 'scan' ? S.folders : S.skip).splice(rm.at, 0, rm.f); S.removed = null; renderSettings(); return; }
    if (b.dataset.fadd) { S.folders.push(S.suggest.splice(+b.dataset.fadd, 1)[0]); S.removed = null; renderSettings(); return; }
    if (b.dataset.fopen) { S.adding = b.dataset.fopen; renderSettings(); return; }
    if (b.dataset.fcancel) { var was = S.adding; S.adding = null; renderSettings(); if ($('add-' + was)) $('add-' + was).focus(); return; }
    if (b.dataset.scan) { runScan(b.dataset.scan); return; }
    var a = b.dataset.act;
    if (a === 'close-tray') { S.tray = false; renderHero(); $('tray-btn').focus(); }
    else if (a === 'confirm') { S.tray = false; renderHero(); confirmSheet(picks()); }
    else if (a === 'run') run();
    else if (a === 'cancel-run') { S.cancel = true; b.disabled = true; b.textContent = 'Stopping…'; }
    else if (a === 'retry') { var again = S.lastRun.results.filter(function (x) { return x.state === 'failed'; }).map(function (x) { return x.i; }).concat(S.lastRun.notStarted); confirmSheet(again); }
    else if (a === 'close') { closeSheet(); renderAll(); }
    else if (a === 'goto-questions') { S.tab = 'tidy'; renderHero(); $('tab-tidy').scrollIntoView({ block: 'start', behavior: reduced ? 'auto' : 'smooth' }); $('tab-tidy').focus({ preventScroll: true }); }
    else if (a === 'toggle-pile') { S.pile = !S.pile; renderHero(); }
    else if (a === 'bring-back') { S.later = {}; renderAll(); }
    else if (a === 'settings') settingsSheet();
    else if (a === 'reset') { S = fresh(); closeSheet(); renderAll(); }
    else if (a === 'empty') {
      Object.keys(S.held).forEach(function (k) { S.tossed += S.held[k]; var m = S.heldBy[k]; S.freedBy[m] = (S.freedBy[m] || 0) + S.held[k]; S.gone[k] = true; delete S.held[k]; });
      renderAll();
    }
    else if (a === 'report') {
      var text = reportText(), box = $('report-box'), show = function (msg) { box.innerHTML = '<p class="note">' + msg + '</p>'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { show('Copied. Paste it into your agent.'); }, function () { box.innerHTML = '<textarea id="report-text" aria-label="Disk report" readonly>' + esc(text) + '</textarea>'; $('report-text').select(); });
      else { box.innerHTML = '<textarea id="report-text" aria-label="Disk report" readonly>' + esc(text) + '</textarea>'; $('report-text').select(); }
    }
  });
  document.addEventListener('submit', function (e) {
    var fm = e.target.closest('[data-fform]'); if (!fm) return;
    e.preventDefault();
    var kind = fm.dataset.fform, v = fm.querySelector('input').value.trim();
    if (!v) { fm.querySelector('input').focus(); return; }
    (kind === 'scan' ? S.folders : S.skip).push({ p: v, m: kind === 'scan' ? 'Not scanned yet' : 'Skipped from now on' });
    S.adding = null; S.removed = null; renderSettings(); if ($('add-' + kind)) $('add-' + kind).focus();
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.ack) { S.acks[t.dataset.ack] = t.checked; var b = $('q-toss'); if (b) b.disabled = !t.checked; var g = $('go'); if (g && S.sheet === 'confirm') g.disabled = !acksDone(S.target.map(byId)); }
    if (t.dataset.pile) { var id = t.dataset.pile; if (t.checked) addToPile(id); else takeOut(id); renderAll(); }
    if (t.dataset.part) { var pt = t.dataset.part.split(':'), it = byId(pt[0]); it.parts[+pt[1]].on = t.checked; it.size = partSum(it); renderAll(); }
    if (t.dataset.auto) S.auto[t.dataset.auto] = t.checked;
  });
  ['pointerover', 'focusin'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (e.target.closest && e.target.closest('#cta') && !$('cta').disabled && !reduced) $('crates').classList.add('eager'); }); });
  ['pointerout', 'focusout'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (e.target.closest && e.target.closest('#cta')) $('crates').classList.remove('eager'); }); });
  document.addEventListener('pointerdown', function (e) { if (e.button === 0 && e.target.closest && e.target.closest('#tray-close')) { e.preventDefault(); S.tray = false; renderHero(); $('tray-btn').focus(); } });
  document.addEventListener('toggle', function (e) { var k = e.target.dataset && e.target.dataset.open; if (k) S.open[k] = e.target.open; }, true);
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'sim-free') { S.drift = BASE_FREE + S.tossed - parseFloat(t.value); renderHero(); renderMap(); }
    if (t.id === 'low-gb') { S.low = +t.value; $('low-out').textContent = S.low + ' GB'; renderHero(); }
    if (t.id === 'crit-gb') { S.crit = +t.value; $('crit-out').textContent = S.crit + ' GB'; renderHero(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.tray) { S.tray = false; renderHero(); $('tray-btn').focus(); return; } if (e.key === 'Escape' && S.sheet && !S.running) { closeSheet(); renderAll(); } });

  waves();
  renderAll();
})();
</script>
